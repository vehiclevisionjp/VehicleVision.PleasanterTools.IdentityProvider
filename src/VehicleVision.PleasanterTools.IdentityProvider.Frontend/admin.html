<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- **検索エンジンに載せない。** 管理画面の入口を晒さない -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- **配置先のサブパスと管理画面の入口。** サーバが配信時に差し替える（HtmlShell.cs） -->
    <meta name="idp-base-path" content="__IDP_BASE_PATH__" />
    <meta name="idp-admin-path" content="__IDP_ADMIN_PATH__" />
    <!-- **ヘッダー（鉄紺）の色。ライト・ダークとも同じ。** meta では CSS 変数が使えないため値を直接書く（DesignReference の `--color-primary`） -->
    <meta name="theme-color" content="#17184b" />
    <!-- ファビコンは DesignReference の略称入りの製品アイコン（略称 IP。`public/`。複写元は `assets/icons/products/IdentityProvider/`） -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/biikurun-icon-32.png" />
    <link rel="apple-touch-icon" href="/biikurun-icon-180.png" />
    <!-- **書体は同梱する**（DesignReference 第 2.3 版。`public/css/app-fonts.css` と `public/fonts/app/`）。
         画面にある文字の区画だけが読み込まれ、同梱に無い字や読み込めないときは端末の書体で表示される -->
    <link rel="stylesheet" href="/css/app-fonts.css" />
    <title>IdP 管理</title>
  </head>
  <body>
    <div id="admin"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
